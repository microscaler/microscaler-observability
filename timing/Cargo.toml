[package]
name = "microscaler-timing"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Zero-dependency, lock-free operation timing: annotate a function and its latency histogram appears on /metrics as op_duration_seconds{component,op,outcome}."
license = "Apache-2.0"
repository = "https://github.com/microscaler/microscaler-observability"
readme = "README.md"
keywords = ["metrics", "prometheus", "histogram", "latency", "coroutine"]
categories = ["development-tools::profiling"]

# No runtime dependencies besides the proc-macro crate: recording is a handful of relaxed atomic adds on a static,
# so this is safe to call from `may` coroutines, Tokio tasks or plain threads, and cheap to depend on from any crate.
[dependencies]
microscaler-timing-macros = { path = "macros", version = "0.1.0" }

[dev-dependencies]
# The coroutine runtime the services run on: the tests record from coroutines that yield between start and finish.
may = "0.3"

[lints.rust]
# One `unsafe` block (dereferencing a pointer that was made from a `&'static Site`), justified where it is.
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "warn"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
let_underscore_must_use = "deny"
