# Dependabot — weekly dependency update PRs.
#
# Cargo updates are especially important here because the 0.29.x OpenTelemetry
# pins must stay aligned with Lifeguard's (see docs/PRD.md §Phase O.0). A
# Dependabot bump to 0.30.x will open a PR that CI correctly blocks via the
# MSRV and clippy gates until the coordinated cross-repo bump lands.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
      include: scope
    # OpenTelemetry family bumps need coordinated cross-repo landing. Keep
    # them in their own group so a single Dependabot PR covers all five
    # crates, not five separate ones.
    groups:
      # Same group, patterns and Monday 09:00 UTC slot in every Microscaler Rust repo: the crates they all compile
      # move to the same versions in the same week, which is what lets the shared sccache on the ms02 CI runners hit
      # across repos. Majors still arrive one PR each.
      shared-stack:
        patterns: ["tokio*", "serde*", "hyper*", "http-body*", "tower*", "tracing*", "opentelemetry*", "prost*",
                   "tonic*", "rustls*", "ring", "aws-lc*", "cc", "openssl*", "reqwest*", "chrono*", "uuid", "anyhow",
                   "thiserror*", "clap*", "jsonwebtoken", "redis*", "futures*", "bytes", "regex*", "syn", "quote",
                   "proc-macro2", "rand*", "base64", "sha2", "hmac", "ed25519*", "time", "url", "once_cell",
                   "parking_lot*", "dashmap", "smallvec", "itoa", "memchr", "hashbrown", "indexmap", "pyroscope*"]
        update-types: ["minor", "patch"]
      opentelemetry:
        patterns:
          - 'opentelemetry'
          - 'opentelemetry_sdk'
          - 'opentelemetry-otlp'
          - 'opentelemetry-semantic-conventions'
          - 'opentelemetry-appender-tracing'
          - 'tracing-opentelemetry'
      tracing:
        patterns:
          - 'tracing'
          - 'tracing-subscriber'
      pyroscope:
        patterns:
          - 'pyroscope'
          - 'pyroscope_pprofrs'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
      include: scope
